[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "astrocolor"
version = "0.1.0-beta3"
description = "General-purpose photometric conversions, image processing and color calculation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Askaniy Anpilogov", email = "aaskaniy@gmail.com" },
]
requires-python = ">=3.12"

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "certifi>=2026.10.23",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "scipy-stubs>=1.18.1.1",
]

[project.urls]
Homepage = "https://github.com/Askaniy/AstroColor"
Repository = "https://github.com/Askaniy/AstroColor"
Issues = "https://github.com/Askaniy/AstroColor/issues"
Changelog = "https://github.com/Askaniy/AstroColor/releases"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
]

[tool.basedpyright]
reportImportCycles = false
exclude = ["temp"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/astrocolor/tests"]
